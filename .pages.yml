# Pages CMS editor setup (https://app.pagescms.org).
# Only GitHub accounts with write access to this repo can sign in and edit.

media:
  input: images
  output: /images
  categories:
  - image
content:
- name: content
  label: Website text & photos
  type: file
  path: _data/content.yml
  format: yaml
  fields:
  - name: business_name
    label: Business name
    type: string
    required: true
  - name: seo_title
    label: Browser tab / Google title
    type: string
  - name: seo_description
    label: Google description
    type: text
  - name: logo
    label: Logo (white on transparent PNG works best)
    type: image
  - name: navigation
    label: Menu & footer (every page)
    type: object
    fields:
    - name: about
      label: About link
      type: string
    - name: portfolio
      label: Portfolio link
      type: string
    - name: services
      label: Services link
      type: string
    - name: book
      label: Header button (opens the Packages page)
      type: string
    - name: instagram
      label: Footer Instagram link
      type: string
    - name: email
      label: Footer Email link
      type: string
  - name: hero
    label: Top banner
    type: object
    fields:
    - name: background
      label: Background photo (wide/landscape)
      type: image
    - name: eyebrow
      label: Small label above the slogan
      type: string
    - name: title_line_1
      label: Slogan line 1 (white)
      type: string
    - name: title_line_2
      label: Slogan line 2 (blue)
      type: string
    - name: subtitle
      label: Text under the slogan
      type: text
    - name: primary_button
      label: Blue button text
      type: string
    - name: secondary_button
      label: Outline button text
      type: string
  - name: highlights
    label: Highlights strip (under the banner)
    type: object
    list: true
    fields:
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: string
  - name: filters
    label: Photo filter buttons (home gallery & Portfolio page)
    type: object
    fields:
    - name: all
      label: All
      type: string
    - name: rolling
      label: Rolling
      type: string
    - name: static
      label: Static
      type: string
    - name: details
      label: Details
      type: string
    - name: events
      label: Events
      type: string
  - name: gallery
    label: Home page gallery (highlights)
    type: object
    fields:
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
  - name: portfolio
    label: Portfolio page
    type: object
    fields:
    - name: seo_title
      label: Browser tab / Google title
      type: string
    - name: seo_description
      label: Google description
      type: text
    - name: banner
      label: Banner photo at the top (optional)
      type: image
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro text
      type: text
    - name: home_button
      label: Home page button text (under the gallery)
      type: string
    - name: book_button
      label: Bottom "book" button text
      type: string
    - name: packages_button
      label: Bottom "packages" button text
      type: string
  - name: services
    label: Services
    type: object
    fields:
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
    - name: items
      label: Services
      type: object
      list: true
      fields:
      - name: title
        label: Title
        type: string
      - name: text
        label: Description
        type: text
  - name: process
    label: How it works
    type: object
    fields:
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
    - name: steps
      label: Steps
      type: object
      list: true
      fields:
      - name: title
        label: Title
        type: string
      - name: text
        label: Description
        type: text
  - name: about
    label: About
    type: object
    fields:
    - name: photo
      label: Photo of you
      type: image
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
    - name: paragraphs
      label: Paragraphs
      type: text
      list: true
    - name: button
      label: Button text
      type: string
  - name: packages
    label: Packages page
    type: object
    fields:
    - name: seo_title
      label: Browser tab / Google title
      type: string
    - name: seo_description
      label: Google description
      type: text
    - name: banner
      label: Banner photo at the top (optional)
      type: image
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro text
      type: text
    - name: home_button
      label: Home page button text (under Services)
      type: string
    - name: button
      label: Button text on each package
      type: string
    - name: items
      label: Packages (no prices are shown on the site)
      type: object
      list: true
      fields:
      - name: name
        label: Package name (also used in the booking form)
        type: string
      - name: features
        label: What's included
        type: string
        list: true
    - name: addons_eyebrow
      label: Add-ons small label
      type: string
    - name: addons_heading
      label: Add-ons heading
      type: string
    - name: addons_intro
      label: Add-ons intro text
      type: text
    - name: addons
      label: Add-ons (also shown as checkboxes in the booking form)
      type: object
      list: true
      fields:
      - name: name
        label: Name
        type: string
      - name: text
        label: Description
        type: text
      - name: icon
        label: Icon
        type: select
        options:
          values:
          - name: location
            label: Location pin
          - name: rush
            label: Stopwatch (rush)
          - name: photos
            label: Photos
          - name: usb
            label: USB drive
          - name: plus
            label: Plus sign
    - name: notes_heading
      label: Notes heading
      type: string
    - name: notes
      label: Notes
      type: text
      list: true
  - name: locations
    label: Recommended locations (Packages page, below booking; hidden until a location has a name)
    type: object
    fields:
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro text
      type: text
    - name: map_button
      label: Map link text
      type: string
    - name: places
      label: Locations
      type: object
      list:
        collapsible:
          collapsed: false
          summary: '{name}'
      fields:
      - name: name
        label: Location name (leave blank to hide this slot)
        type: string
      - name: vibe
        label: Vibe (e.g. Moody & industrial)
        type: string
      - name: description
        label: Description
        type: text
      - name: photo
        label: Main photo (optional; add more photos under 'Location photos')
        type: image
      - name: map_link
        label: Google Maps link (optional)
        type: string
  - name: contact
    label: Booking & contact (bottom of the Packages page)
    type: object
    fields:
    - name: eyebrow
      label: Small label
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro text
      type: text
    - name: email
      label: Email (bookings go here; a new address needs one re-activation from FormSubmit)
      type: string
    - name: email_label
      label: Email card label
      type: string
    - name: instagram_label
      label: Instagram card label
      type: string
    - name: instagram_handle
      label: Instagram handle
      type: string
    - name: instagram_url
      label: Instagram link
      type: string
    - name: links
      label: Other profile links (shown as cards under Instagram)
      type: object
      list: true
      fields:
      - name: label
        label: Small label (e.g. ShotFinder)
        type: string
      - name: text
        label: Card text
        type: string
      - name: url
        label: Link
        type: string
    - name: note
      label: Note under the cards
      type: text
    - name: button
      label: Send button text
      type: string
    - name: form
      label: Booking form wording
      type: object
      fields:
      - name: name_label
        label: Name label
        type: string
      - name: email_label
        label: Email label
        type: string
      - name: car_label
        label: Car label
        type: string
      - name: car_placeholder
        label: Car example text
        type: string
      - name: type_label
        label: Shoot type label
        type: string
      - name: addons_label
        label: Add-ons label
        type: string
      - name: details_label
        label: Details label
        type: string
      - name: details_placeholder
        label: Details example text
        type: string
      - name: sending
        label: Button text while sending
        type: string
      - name: success
        label: Message after a booking is sent
        type: text
      - name: error
        label: Message if sending fails
        type: string
      - name: error_link
        label: Email link text if sending fails
        type: string
    - name: shoot_types
      label: Shoot type choices (match package names so 'Book this package' preselects them)
      type: string
      list: true
- name: portfolio_photos
  label: Portfolio photos
  type: file
  path: _data/portfolio_photos.yml
  format: yaml
  fields:
  - name: photos
    label: Photos
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{caption}'
    fields:
    - name: image
      label: Photo
      type: image
    - name: caption
      label: Caption (for photos also in Home gallery photos, the home caption is used automatically)
      type: string
    - name: category
      label: Filter category
      type: select
      options:
        values:
        - name: rolling
          label: Rolling
        - name: static
          label: Static
        - name: details
          label: Details
        - name: events
          label: Events
    - name: size
      label: Tile size
      type: select
      options:
        values:
        - name: normal
          label: Normal
        - name: wide
          label: Wide (2 columns)
        - name: tall
          label: Tall (2 rows)
- name: gallery_photos
  label: Home gallery photos
  type: file
  path: _data/gallery_photos.yml
  format: yaml
  fields:
  - name: photos
    label: Photos
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{caption}'
    fields:
    - name: image
      label: Photo
      type: image
    - name: caption
      label: Caption (also shown on the Portfolio page for the same photo)
      type: string
    - name: category
      label: Filter category
      type: select
      options:
        values:
        - name: rolling
          label: Rolling
        - name: static
          label: Static
        - name: details
          label: Details
        - name: events
          label: Events
    - name: size
      label: Tile size
      type: select
      options:
        values:
        - name: normal
          label: Normal
        - name: wide
          label: Wide (2 columns)
        - name: tall
          label: Tall (2 rows)
- name: location_photos
  label: Location photos
  type: file
  path: _data/location_photos.yml
  format: yaml
  fields:
  - name: locations
    label: Extra photos per location
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{location}'
    fields:
    - name: location
      label: Location name (must match the name in Recommended locations exactly)
      type: string
    - name: photo_label
      label: Label for the main photo (e.g. Winter, or the car)
      type: string
    - name: photo_credit
      label: Credit for the main photo (required if you didn't take it)
      type: string
    - name: photo_credit_link
      label: Credit link for the main photo
      type: string
    - name: more_photos
      label: More photos (shown as thumbnails visitors can click)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: photo
        label: Photo
        type: image
      - name: label
        label: Label (e.g. Summer)
        type: string
      - name: credit
        label: Photo credit (required for photos you didn't take)
        type: string
      - name: credit_link
        label: Credit link (photo's source page)
        type: string
- name: more_locations
  label: More locations & suggestions
  type: file
  path: _data/more_locations.yml
  format: yaml
  fields:
  - name: spots
    label: Extra recommended locations
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{name}'
    fields:
    - name: name
      label: Location name
      type: string
    - name: map_link
      label: Google Maps link (if blank, it searches Maps for the name)
      type: string
  - name: map_button
    label: Extra locations card - map link text
    type: string
  - name: list_tag
    label: Extra locations card - small tag
    type: string
  - name: list_heading
    label: Extra locations card - heading
    type: string
  - name: suggest_tag
    label: Suggestion card - small tag
    type: string
  - name: suggest_heading
    label: Suggestion card - heading (leave blank to hide the card)
    type: string
  - name: suggest_text
    label: Suggestion card - text
    type: text
  - name: location_label
    label: Location field label
    type: string
  - name: location_placeholder
    label: Location field hint
    type: string
  - name: why_label
    label: Details field label
    type: string
  - name: why_placeholder
    label: Details field hint
    type: string
  - name: from_label
    label: Name field label
    type: string
  - name: button
    label: Button text
    type: string
  - name: sending
    label: Text while sending
    type: string
  - name: email_subject
    label: Subject of the email you receive
    type: string
  - name: success
    label: Message after a successful send
    type: string
  - name: error
    label: Message if sending fails
    type: string
  - name: error_link
    label: Link text to email instead
    type: string
- name: specialties
  label: Specialties (home page)
  type: file
  path: _data/specialties.yml
  format: yaml
  fields:
  - name: eyebrow
    label: Section label (read by screen readers)
    type: string
  - name: heading
    label: Section name
    type: string
  - name: items
    label: Specialties
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{eyebrow}'
    fields:
    - name: eyebrow
      label: Small label (e.g. Rolling shots)
      type: string
    - name: heading
      label: Heading
      type: string
    - name: text
      label: Short description
      type: text
    - name: points
      label: Bullet points
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Bold part
        type: string
      - name: text
        label: Rest of the line
        type: string
    - name: photo_main
      label: Big photo (the tall one)
      type: image
    - name: photo_2
      label: Small photo (top)
      type: image
    - name: photo_3
      label: Small photo (bottom)
      type: image
    - name: button
      label: Button text (goes to the booking form)
      type: string
- name: utmedia
  label: UTMedia page
  type: file
  path: _data/utmedia.yml
  format: yaml
  fields:
  - name: nav_label
    label: Menu & footer link text
    type: string
  - name: seo_title
    label: Browser tab / Google title
    type: string
  - name: seo_description
    label: Google description
    type: text
  - name: banner
    label: Banner photo at the top (optional)
    type: image
  - name: eyebrow
    label: Small label above the title
    type: string
  - name: heading
    label: Page title
    type: string
  - name: tagline
    label: Tagline under the title
    type: string
  - name: intro
    label: Intro paragraph
    type: text
  - name: sponsor
    label: Sponsor
    type: object
    fields:
    - name: label
      label: Text before the name (e.g. Sponsored by)
      type: string
    - name: name
      label: Sponsor name
      type: string
    - name: link
      label: Sponsor website
      type: string
  - name: about_paragraphs
    label: More about UTMedia (paragraphs under the intro)
    type: text
    list: true
  - name: platforms_heading
    label: '''Where we meet'' heading'
    type: string
  - name: platforms
    label: Where we meet (cards)
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{title}'
    fields:
    - name: icon
      label: Icon
      type: select
      options:
        values:
        - name: instagram
          label: Instagram
        - name: discord
          label: Discord
        - name: other
          label: Circle
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
  - name: pillars_eyebrow
    label: 'Cards section: small label'
    type: string
  - name: pillars_heading
    label: 'Cards section: heading'
    type: string
  - name: pillars
    label: Cards
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{title}'
    fields:
    - name: icon
      label: Icon
      type: select
      options:
        values:
        - name: feedback
          label: Speech bubble
        - name: showcase
          label: Picture
        - name: connect
          label: People
        - name: camera
          label: Camera
        - name: plus
          label: Plus sign
    - name: title
      label: Title
      type: string
    - name: text
      label: Text
      type: text
  - name: showcase_heading
    label: 'Community photos: heading (section hidden until a photo is added)'
    type: string
  - name: showcase_intro
    label: 'Community photos: intro text'
    type: text
  - name: showcase
    label: Community photos
    type: object
    fields:
    - name: photos
      label: Photos
      type: object
      list:
        collapsible:
          collapsed: false
          summary: '{caption}'
      fields:
      - name: image
        label: Photo
        type: image
      - name: caption
        label: Caption
        type: string
      - name: photographer
        label: Photographer (credit shown with the caption)
        type: string
      - name: size
        label: Tile size
        type: select
        options:
          values:
          - name: normal
            label: Normal
          - name: wide
            label: Wide (2 columns)
          - name: tall
            label: Tall (2 rows)
  - name: join_heading
    label: 'Application section: heading'
    type: string
  - name: join_text
    label: 'Application section: intro text'
    type: text
  - name: join_button
    label: 'Application form: submit button text'
    type: string
  - name: join_link
    label: Optional extra join link shown under the form (e.g. a Discord invite)
    type: string
  - name: application
    label: Application form wording & delivery
    type: object
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: email
      label: Send applications to this email
      type: string
    - name: email_subject
      label: Email subject (applicant's name is added)
      type: string
    - name: name_label
      label: Name label
      type: string
    - name: socials_label
      label: Social handles label
      type: string
    - name: socials_placeholder
      label: Social handles example text
      type: string
    - name: why_label
      label: '''Why join'' label'
      type: string
    - name: why_placeholder
      label: '''Why join'' example text'
      type: string
    - name: sending
      label: Button text while sending
      type: string
    - name: success
      label: Message after applying
      type: text
    - name: error
      label: Message if sending fails
      type: string
    - name: error_link
      label: Email link text if sending fails
      type: string
    - name: alt_link_text
      label: Text for the optional extra join link
      type: string
